# Deployment overrides for misp-docker, loaded through COMPOSE_FILE in
# misp-docker/.env (written by scripts/init.sh). All values come from that .env.
services:
  misp-core:
    healthcheck:
      # The first start (database, updates, galaxies, warninglists) takes
      # minutes. Failed checks in this period do not count; the container is
      # healthy as soon as PHP-FPM listens, so later starts are not slowed down.
      start_period: 15m
    volumes:
      # Run at the end of every start: force_https, PHP session hardening.
      - "../deploy/misp/customize_misp.sh:/custom/files/customize_misp.sh:ro"

  mail:
    volumes:
      # Extra exim macros, written by scripts/init.sh (SMARTHOST_ALLOW_PLAINTEXT_AUTH).
      - "./exim-macros:/etc/exim4/_docker_additional_macros:ro"

  misp-nginx:
    # No ports on the Docker host: nginx has an address of its own on the LAN.
    ports: !reset []
    environment:
      - "NGINX_INTERNAL_HTTP_PORT=${MISP_HTTP_PORT:-8080}"
      - "NGINX_INTERNAL_HTTPS_PORT=${MISP_HTTPS_PORT:-8443}"
    volumes:
      # Serves zsazsa under /zsazsa/ on MISP's address (single sign-on).
      - "../deploy/nginx/05-zsazsa.sh:/docker-entrypoint.d/05-zsazsa.sh:ro"
    networks:
      default:
      lan:
        ipv4_address: "${MISP_LAN_IP:?Missing MISP_LAN_IP in .env, run scripts/init.sh}"

networks:
  lan:
    name: "${LAN_NETWORK_NAME:-cti-lan}"
    external: true
