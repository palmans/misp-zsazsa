# Example nginx configuration for a reverse proxy in front of this deployment.
# Replace misp.example.com, the certificate paths, 192.168.1.19 (MISP_LAN_IP)
# and 8443 (MISP_HTTPS_PORT) with your own values.
#
# zsazsa needs no rule of its own: misp-nginx serves it under /zsazsa/.

server {
    listen 80;
    server_name misp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name misp.example.com;

    ssl_certificate     /etc/ssl/misp.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/misp.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50M;

    location / {
        # misp-nginx uses a self-signed certificate.
        proxy_pass https://192.168.1.19:8443;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
