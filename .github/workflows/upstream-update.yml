# Refreshes misp-docker/, misp-scraper/ and zsazsa/ from upstream with
# scripts/update-upstream.sh and opens (or updates) one pull request with the
# changes. Nothing happens when upstream has not changed.
#
# Then it runs the Tests workflow (tests/check.sh, tests/e2e.sh) on that pull
# request and reports the result on it, as the status "Upstream update / tests"
# and, when they fail, in a comment. A pull request opened with GITHUB_TOKEN
# starts no pull_request workflows of its own, hence this call.
#
# Needs: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".
name: Upstream update

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: upstream-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      operation: ${{ steps.pr.outputs.pull-request-operation }}
      number: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update upstream folders
        env:
          UPSTREAM_FAILED_PATCHES: ${{ runner.temp }}/failed-patches
        run: bash scripts/update-upstream.sh

      - name: Describe the changes
        id: describe
        env:
          FAILED: ${{ runner.temp }}/failed-patches
          BODY: ${{ runner.temp }}/pr-body.md
        run: |
          bash .github/scripts/upstream-pr.sh body "$FAILED" > "$BODY"
          title=$(bash .github/scripts/upstream-pr.sh title "$FAILED")
          labels=upstream
          [[ -s "$FAILED" ]] && labels+=$'\n'patch-failed
          {
            echo "title=$title"
            echo "labels<<EOF"
            echo "$labels"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: upstream/update
          delete-branch: true
          title: ${{ steps.describe.outputs.title }}
          commit-message: ${{ steps.describe.outputs.title }}
          body-path: ${{ runner.temp }}/pr-body.md
          labels: ${{ steps.describe.outputs.labels }}

      - name: Mark the tests as pending
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="Upstream update / tests" \
            -f target_url="$RUN" -f description="tests/check.sh and tests/e2e.sh are running"

  test:
    needs: update
    if: needs.update.outputs.operation == 'created' || needs.update.outputs.operation == 'updated'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
      # The pull request is made on top of the commit this run checked out.
      base: ${{ github.sha }}

  report:
    needs: [update, test]
    if: always() && (needs.update.outputs.operation == 'created' || needs.update.outputs.operation == 'updated')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Report the result on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.test.result }}
          SHA: ${{ needs.update.outputs.sha }}
          NUMBER: ${{ needs.update.outputs.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            success) state=success description="tests/check.sh and tests/e2e.sh passed" ;;
            cancelled) state=error description="The tests were cancelled" ;;
            *) state=failure description="The tests failed: see the run before merging" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="Upstream update / tests" \
            -f target_url="$RUN" -f description="$description"
          if [[ "$state" != success ]]; then
            body=$(printf '%s\n\n%s\n' \
              "⚠️ **The tests of this update did not pass** ($RESULT) for ${SHA:0:7}: [workflow run]($RUN)." \
              "The job summaries list what failed; the e2e jobs print the container logs and the report of \`scripts/report.sh\` under *Logs*. Fix it on this branch (a push runs the tests again), or rerun the workflow.")
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$body" > /dev/null
          fi
          echo "$description" >> "$GITHUB_STEP_SUMMARY"
