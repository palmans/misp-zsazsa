# TEMPORARY: validates the Tests workflow on this branch before it is merged.
# Removed again before the branch is merged.
name: Validate tests (temporary)

on:
  push:
    branches: [claude/upstream-update-workflow-tests-4n531b]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ github.sha }}
      base: main

  # The same on this branch merged with the open upstream update (PR #2).
  pr2-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          git -c user.name=ci -c user.email=ci@example.com merge --no-edit origin/upstream/update
          bash tests/check.sh

  pr2-e2e:
    needs: pr2-check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mode: [install, update]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          MODE: ${{ matrix.mode }}
          E2E_LOGS: ${{ runner.temp }}/e2e-logs
        run: |
          base=$(git rev-parse HEAD)
          git -c user.name=ci -c user.email=ci@example.com merge --no-edit origin/upstream/update
          args=()
          [[ "$MODE" == update ]] && args+=(--upgrade-from "$base")
          sudo --preserve-env=CI,GITHUB_ACTIONS,GITHUB_STEP_SUMMARY,E2E_LOGS bash tests/e2e.sh "${args[@]}"
      - if: failure()
        env:
          E2E_LOGS: ${{ runner.temp }}/e2e-logs
        run: |
          for f in "$E2E_LOGS"/*; do
            [[ -f "$f" ]] || continue
            echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"
          done
